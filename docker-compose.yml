services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: eval
      POSTGRES_DB: eval
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U eval"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  java-evaluator:
    build: ./java-evaluator
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports: ["8081:8081"]

  eval-api:
    build: ./python-evals
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://eval:eval@postgres:5432/eval
      REDIS_URL: redis://redis:6379/0
      JAVA_EVALUATOR_URL: http://java-evaluator:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      java-evaluator:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml
    ports: ["4318:4318"]
